  if (handle) { syncCursor(handle.end ? 'move' : HANDLE_CURSORS[handle.pos]); return; }
  if (quickDots().some(d => near(d, pointer, 11))) { syncCursor('pointer'); return; }

  const item = hitTest(pointer.world);
  if ((item?.id ?? null) !== (hover?.id ?? null)) { hover = item; invalidate(); }
  syncCursor(item ? 'move' : 'default');
}

function onPointerUp(e) {
  trackPointer(e);
  if (!mode) return;
  const m = mode;
  switch (m.type) {
    case 'pan':
      mode = null;
      syncCursor();
      if (m.button === 2 && !m.moved) showContextMenu(e.clientX, e.clientY);
      break;
    case 'marquee':
      mode = null;
      selectionChanged();
      break;
    case 'move':
      mode = null;
      if (m.started) { commit(); refreshContextBar(); }
      else if (m.soleBefore && !e.shiftKey && editableText(doc.items.get(m.clickedId))) startEdit(m.clickedId);
      break;
    case 'resize':
    case 'erase':
      mode = null;
      commit();
      break;
    case 'endpoint':
      mode = null;
      connectHint = null;
      commit();
      break;
    case 'draw': finishDraw(); break;
    case 'pen': {
      const item = strokeFrom(m.points);
      mode = null;
      addItem(item);
      commit();
      break;
    }
    case 'line': finishLine(); connectHint = null; break;
    case 'quick': connectHint = null; finishQuick(); break;
  }
  invalidate();
}

const editableText = item => item && !item.locked && (TEXTUAL.has(item.type) || item.type === 'line' || item.type === 'frame');

function finishDraw() {
  const { kind, rect, start } = mode;
  mode = null;
  if (kind === 'text') {
    const item = addItem(makeItem('text', rect && rect.w > 40 ? { x: rect.x, y: rect.y, w: rect.w } : { x: start.x, y: start.y - 16 }));
    setTool('select');
    setSelection([item.id]);
    startEdit(item.id);
  } else if (kind === 'shape') {
    const r = rect && rect.w > 8 && rect.h > 8 ? rect : { x: start.x - 90, y: start.y - 60, w: 180, h: 120 };
    const item = addItem(makeItem('shape', r));
    setTool('select');
    setSelection([item.id]);
    commit();
  } else {
    const r = rect && rect.w > 40 && rect.h > 40 ? rect : { x: start.x - 480, y: start.y - 270, w: 960, h: 540 };
    const seq = nextFrameSeq();
    const item = addItem(makeItem('frame', { ...r, title: `Frame ${framesInOrder().length + 1}`, seq }));
    setTool('select');
    setSelection([item.id]);
    commit();
  }
}

function onDoubleClick() {
  if (present.on || tool !== 'select' || editing) return;
  const item = hitTest(pointer.world);
  if (!item) {
    const made = createStickyAt(pointer.world);
    return made;
  }
  if (editableText(item)) startEdit(item.id);
}

function onWheel(e) {
  if (e.target.closest && e.target.closest('#framesPanel, #pop')) return;
  e.preventDefault();
  if (present.on) return;
  const r = stage.getBoundingClientRect();
  const at = { x: e.clientX - r.left, y: e.clientY - r.top };
  const unit = e.deltaMode === 1 ? 16 : 1;
  // Notched mouse wheels send whole-number steps with no sideways motion;
  // precision touchpads do not. Wheels zoom, touchpads pan, pinch zooms.
  const notched = Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 50 && e.deltaX === 0 && !e.shiftKey;
  if (e.ctrlKey || e.metaKey || notched) {
    const speed = e.ctrlKey && !notched ? 0.01 : 0.0016;
    zoomAt(at, view.z * Math.exp(-e.deltaY * unit * speed));
  } else {
    view.x += (e.shiftKey ? e.deltaY : e.deltaX) * unit / view.z;
    view.y += (e.shiftKey ? 0 : e.deltaY) * unit / view.z;
    invalidate();
  }
}

// ---- Text editor ----------------------------------------------------------

let editing = null;

function editableValue(item) {
  return item.type === 'frame' ? item.title : item.text;
}

function startEdit(id) {
  if (editing) commitEdit();
  const item = doc.items.get(id);
  if (!item) return;
  const single = item.type === 'frame' || item.type === 'line';
  const area = h('textarea', {
    className: `editor${single ? ' boxed' : ''}`,
    value: editableValue(item) || '',
    // Browser-level spellcheck can upload typed text to a cloud service, and
    // the data-* opt-outs cover common grammar extensions.
    spellcheck: false, autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off',
    'aria-label': 'Edit text', 'data-gramm': 'false', 'data-gramm_editor': 'false', 'data-enable-grammarly': 'false', 'data-lt-active': 'false',
  });
  area.setAttribute('spellcheck', 'false');
  area.setAttribute('autocorrect', 'off');
  stage.append(area);
  editing = { id, area, single };
  area.addEventListener('input', () => { positionEditor(); });
  area.addEventListener('keydown', onEditorKey);
  area.addEventListener('blur', () => { if (editing?.area === area) commitEdit(); });
  $('#hint').hidden = item.type !== 'sticky';
  $('#hint').replaceChildren(h('b', {}, 'Tab'), ' next  ·  ', h('b', {}, 'Ctrl+Enter'), ' below  ·  ', h('b', {}, 'Esc'), ' done');
  refreshContextBar();
  positionEditor();
  area.focus();
  area.setSelectionRange(area.value.length, area.value.length);
  invalidate();
}

function draftOf(item, text) {
  return { ...item, text };
}

function positionEditor() {
  if (!editing) return;
  const item = doc.items.get(editing.id);
  if (!item) { cancelEdit(); return; }
  const area = editing.area;
  const z = view.z;
  const css = area.style;
  if (item.type === 'frame') {
    const p = toScreen(item);
    css.left = `${p.x}px`; css.top = `${p.y - 28}px`; css.width = '240px'; css.height = '24px';
    css.fontSize = '13px'; css.lineHeight = '24px'; css.fontWeight = '600'; css.color = INK; css.paddingTop = '0';
    return;
  }
  if (item.type === 'line') {
    const p = toScreen(pathMidpoint(linePath(item)));
    css.left = `${p.x - 90}px`; css.top = `${p.y - 14}px`; css.width = '180px'; css.height = '28px';
    css.fontSize = '15px'; css.lineHeight = '28px'; css.textAlign = 'center'; css.color = item.color; css.paddingTop = '0';
    return;
  }
  const L = layoutOf(draftOf(item, area.value));
  const box = screenRect(L.box);
  css.left = `${box.x}px`;
  css.top = `${box.y}px`;
  css.width = `${box.w}px`;
  css.fontSize = `${L.size * z}px`;
  css.lineHeight = `${L.lineH * z}px`;
  css.fontWeight = item.bold ? '600' : '400';
  css.textAlign = item.align;
  css.color = item.type === 'sticky' ? textOn(item.color) : item.color;
  if (item.type === 'text') {
    css.height = `${Math.max(L.totalH, L.lineH) * z + 4}px`;
    css.paddingTop = '0';
  } else {
    css.height = `${box.h}px`;
    css.paddingTop = `${Math.max(0, (L.top - L.box.y) * z)}px`;
  }
}

function onEditorKey(e) {
  e.stopPropagation();
  const item = doc.items.get(editing.id);
  if (e.key === 'Escape') { e.preventDefault(); commitEdit(); return; }
  if (editing.single && e.key === 'Enter') { e.preventDefault(); commitEdit(); return; }
  if (e.key === 'Tab' && item.type === 'sticky') {
    e.preventDefault();
    commitEdit();
    nextSticky(doc.items.get(item.id), 'right');
    return;
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && item.type === 'sticky') {
    e.preventDefault();
    commitEdit();
    nextSticky(doc.items.get(item.id), 'down');
  }
}

function closeEditor() {
  const { area } = editing;
  editing = null;
  area.remove();
  $('#hint').hidden = true;
  canvas.focus({ preventScroll: true });
}

function commitEdit() {
  if (!editing) return;
  const { id, area } = editing;
  const value = area.value;
  closeEditor();
  const item = doc.items.get(id);
  if (item) {
    if (item.type === 'frame') patch(id, { title: value.trim() || item.title });
    else if (item.type === 'text' && !value.trim()) { removeItems([id]); sel.delete(id); }
    else {
      const next = patch(id, { text: value });
      if (next.type === 'text') doc.items.set(id, withTextHeight(next));
    }
  }
  commit();
  selectionChanged();
}

function cancelEdit() {
  if (editing) closeEditor();
}

// ---- Keyboard -------------------------------------------------------------

const TOOL_KEYS = { v: 'select', h: 'hand', n: 'sticky', t: 'text', s: 'shape', l: 'line', p: 'pen', e: 'eraser', f: 'frame' };

function typingInField(target) {
  return target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement;
}

function onKeyDown(e) {
  if ($('#dialog').open) return;
  const ctrl = e.ctrlKey || e.metaKey;

  if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); (e.shiftKey ? saveFileAs() : saveFile()); return; }
  if (ctrl && e.key.toLowerCase() === 'o') { e.preventDefault(); openFile(); return; }
  if (ctrl && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(); return; }
  if (typingInField(e.target)) return;

  if (present.on) {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); showFrame(present.index + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); showFrame(present.index - 1); }
    else if (e.key === 'Escape') endPresenting();
    return;
  }

  if (e.key === ' ') {
    e.preventDefault();
    if (!spaceDown) { spaceDown = true; syncCursor(); }
    return;
  }

  if (ctrl) {
    const key = e.key.toLowerCase();
    const actions = {
      z: () => (e.shiftKey ? redo() : undo()),
      y: redo,
      a: () => setSelection(doc.order.filter(id => !doc.items.get(id).locked)),
      d: duplicateSelection,
      g: () => (e.shiftKey ? ungroupSelection() : groupSelection()),
      l: toggleLock,
      '=': () => zoomAt(stageCenter(), view.z * 1.25),
      '+': () => zoomAt(stageCenter(), view.z * 1.25),
      '-': () => zoomAt(stageCenter(), view.z / 1.25),
      0: zoomToActualSize,
      1: fitBoard,
      2: zoomToSelection,
      ']': () => reorder(true),
      '[': () => reorder(false),
    };
    if (actions[key]) { e.preventDefault(); actions[key](); }
    return;
  }
  if (e.altKey) return;

  switch (e.key) {
    case 'Escape':
      closePopover();
      if (mode) {
        mode = null;
        connectHint = null;
        doc.items = new Map(history.base.items);
        doc.order = history.base.order.slice();
        selectionChanged();
        return;
      }
      if (tool !== 'select') setTool('select');
      else if (find.matches.length) closeFind();
      else setSelection([]);
      return;
    case 'Delete':
    case 'Backspace':
      e.preventDefault();
      deleteSelection();
      return;
    case 'Enter': {
      const item = sel.size === 1 ? selectedItems()[0] : null;
      if (editableText(item)) { e.preventDefault(); startEdit(item.id); }
      return;
    }
    case 'Tab': {
      const item = sel.size === 1 ? selectedItems()[0] : null;
      if (item?.type === 'sticky') { e.preventDefault(); nextSticky(item, 'right'); }
      return;
    }
    case 'PageUp': e.preventDefault(); reorder(true); return;
    case 'PageDown': e.preventDefault(); reorder(false); return;
    case '?': showHelp(); return;
    case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown': {
      if (!sel.size) return;
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
      const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
      for (const id of moveTargets()) patch(id, moveItem(doc.items.get(id), dx, dy));
      commit();
      return;
    }
  }

  const key = e.key.toLowerCase();
  if (key === 'm') { toggleMinimap(); return; }
  if (key === 'i') { $('#imageInput').click(); return; }
  if (TOOL_KEYS[key]) setTool(TOOL_KEYS[key]);
}

function onKeyUp(e) {
  if (e.key === ' ') {
    spaceDown = false;
    syncCursor();
  }
}

function onPaste(e) {
  if (typingInField(e.target) || present.on) return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  const spot = pointer.inside ? pointer.world : toWorld(stageCenter());
  if (files.length) { e.preventDefault(); addImageFiles(files, spot); return; }
  const text = e.clipboardData?.getData('text/plain') ?? '';
  e.preventDefault();
  if (clip && text === clip.text) pasteClip();
  else pasteLines(text);
}

function onCopy(e) {
  if (!typingInField(e.target)) copySelection(e);
}

function onCut(e) {
  if (!typingInField(e.target) && copySelection(e)) deleteSelection();
}

function onDrop(e) {
  e.preventDefault();
  const files = [...(e.dataTransfer?.files || [])];
  if (!files.length) return;
  trackPointer(e);
  const board = files.find(f => /\.(mircore|json)$/i.test(f.name));
  if (board) { openDroppedFile(board); return; }
  addImageFiles(files.filter(f => f.type.startsWith('image/')), pointer.world);
}

function bindInput() {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('mousedown', e => e.preventDefault()); // otherwise the canvas steals focus from a new editor
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', () => { mode = null; commit(); });
  canvas.addEventListener('pointerleave', () => { pointer.inside = false; invalidate(); });
  canvas.addEventListener('dblclick', onDoubleClick);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  stage.addEventListener('wheel', onWheel, { passive: false });
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { spaceDown = false; syncCursor(); });
  window.addEventListener('paste', onPaste);
  window.addEventListener('copy', onCopy);
  window.addEventListener('cut', onCut);
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', onDrop);
  window.addEventListener('resize', () => {
    resizeCanvas();
    if (present.on) showFrame(present.index);
  });
}

// Saving, opening and exporting. Board content only ever goes to a file the
// user picked. Nothing is written to localStorage or IndexedDB, so no copy
// lingers in the browser profile.

const file = {
  handle: null,  // FileSystemFileHandle when the browser supports direct writes
  name: null,
  dirty: false,
  generation: 0,
  saving: false,
  failed: false,
  timer: 0,
};
const AUTOSAVE_DELAY = 1200;

// Managed browsers can disable file dialogs. Chrome then rejects with the same
// AbortError as a user pressing Cancel, only instantly, so speed tells them
// apart. Without this, Save would silently do nothing on those machines.
const HUMAN_CANCEL_MS = 300;

async function pick(picker, options) {
  if (typeof picker !== 'function') return { blocked: true };
  const started = performance.now();
  try {
    return { result: await picker.call(window, options) };
  } catch (err) {
    if (err.name === 'AbortError' && performance.now() - started >= HUMAN_CANCEL_MS) return { cancelled: true };
    return { blocked: true };
  }
}
function serialize() {
  const items = doc.order.map(id => doc.items.get(id));
  const used = new Set(items.filter(i => i.type === 'image').map(i => i.asset));
  const assets = {};
  // Deleted images must not survive in the file, so only referenced ones are written.
  for (const id of used) if (doc.assets.has(id)) assets[id] = doc.assets.get(id);
  return JSON.stringify({
    format: FORMAT,
    version: FORMAT_VERSION,
    title: doc.title,
    view: { x: view.x, y: view.y, z: view.z },
    items,
    assets,
  });
}

// ---- Loading untrusted files ----------------------------------------------
// A board may come from anyone, so every field is rebuilt from a whitelist.
// Remote image URLs are dropped here and blocked again by the page's CSP.

const num = (v, fallback = 0) => (Number.isFinite(v) ? clamp(v, -1e7, 1e7) : fallback);
const str = (v, max = 20000) => (typeof v === 'string' ? v.slice(0, max) : '');
const oneOf = (v, list, fallback) => (list.includes(v) ? v : fallback);
const bool = v => v === true;
const colorOf = (v, fallback) => (typeof v === 'string' && (/^#[0-9a-f]{6}$/i.test(v) || v === 'transparent') ? v : fallback);
const size = (v, fallback) => { const n = num(v, fallback); return n >= 1 ? n : fallback; };
const ID_RE = /^[a-z0-9_-]{1,40}$/i;
const idOf = v => (typeof v === 'string' && ID_RE.test(v) ? v : null);

function cleanEnd(end) {
  if (!end || typeof end !== 'object') return { x: 0, y: 0 };
  if (idOf(end.id)) return { id: end.id, side: oneOf(end.side, ['t', 'r', 'b', 'l', 'auto'], 'auto') };
  return { x: num(end.x), y: num(end.y) };
}

function cleanItem(raw) {
  if (!raw || typeof raw !== 'object' || !ITEM_TYPES.includes(raw.type) || !idOf(raw.id)) return null;
  const common = { id: raw.id, type: raw.type, locked: bool(raw.locked), group: idOf(raw.group) };
  const box = { x: num(raw.x), y: num(raw.y), w: size(raw.w, 100), h: size(raw.h, 100) };
  const prose = { text: str(raw.text), bold: bool(raw.bold), align: oneOf(raw.align, ['left', 'center', 'right'], 'center') };
  switch (raw.type) {
    case 'sticky':
      return { ...common, ...box, ...prose, color: colorOf(raw.color, STICKY_COLORS[0]), fontSize: clamp(num(raw.fontSize), 0, 400) };
    case 'text':
      return { ...common, ...box, ...prose, color: colorOf(raw.color, INK), fontSize: clamp(size(raw.fontSize, 24), 6, 400) };
    case 'shape':
      return {
        ...common, ...box, ...prose, shape: oneOf(raw.shape, SHAPE_NAMES, 'rect'), fill: colorOf(raw.fill, '#ffffff'), stroke: colorOf(raw.stroke, INK),
        strokeWidth: clamp(num(raw.strokeWidth, 2), 0, 40), dash: bool(raw.dash), fontSize: clamp(size(raw.fontSize, 18), 6, 400), color: colorOf(raw.color, INK),
      };
    case 'line':
      return {
        ...common, a: cleanEnd(raw.a), b: cleanEnd(raw.b), kind: oneOf(raw.kind, ['straight', 'elbow', 'curve'], 'curve'), color: colorOf(raw.color, INK),
        width: clamp(num(raw.width, 2), 0.5, 40), dash: bool(raw.dash), startCap: oneOf(raw.startCap, ['none', 'arrow'], 'none'), endCap: oneOf(raw.endCap, ['none', 'arrow'], 'arrow'), text: str(raw.text, 500),
      };
    case 'pen': {
      const pts = Array.isArray(raw.pts) ? raw.pts.filter(Number.isFinite).slice(0, 400000) : [];
      if (pts.length < 2) return null;
      if (pts.length % 2) pts.pop();
      return { ...common, ...box, ow: size(raw.ow, 1), oh: size(raw.oh, 1), pts, color: colorOf(raw.color, INK), width: clamp(num(raw.width, 3), 0.5, 80), alpha: clamp(num(raw.alpha, 1), 0.05, 1) };
    }
    case 'frame':
      return { ...common, ...box, title: str(raw.title, 200), fill: colorOf(raw.fill, '#ffffff'), seq: num(raw.seq) };
    case 'image':
      return idOf(raw.asset) ? { ...common, ...box, asset: raw.asset } : null;
  }
  return null;
}

function parseBoard(text) {
  const raw = JSON.parse(text);
  if (raw?.format !== FORMAT) throw new Error('This is not a MirCore board.');
  if (!Number.isInteger(raw.version) || raw.version > FORMAT_VERSION) throw new Error('This board was made by a newer version of MirCore.');
  const assets = new Map();
  for (const [id, url] of Object.entries(raw.assets && typeof raw.assets === 'object' ? raw.assets : {})) {
    if (idOf(id) && typeof url === 'string' && IMAGE_TYPES.test(url)) assets.set(id, url);
  }
  const items = new Map();
  for (const entry of Array.isArray(raw.items) ? raw.items.slice(0, 200000) : []) {
    const item = cleanItem(entry);
    if (item && !items.has(item.id) && (item.type !== 'image' || assets.has(item.asset))) items.set(item.id, item);
  }
  for (const item of items.values()) {
    if (item.type !== 'line') continue;
    const detach = end => (end.id && (!items.has(end.id) || !CONNECTABLE.has(items.get(end.id).type)) ? { x: 0, y: 0 } : end);
    items.set(item.id, { ...item, a: detach(item.a), b: detach(item.b) });
  }
  const v = raw.view || {};
  return {
    title: str(raw.title, 120) || 'Untitled board',
    items, assets,
    view: Number.isFinite(v.z) ? { x: num(v.x), y: num(v.y), z: clamp(v.z, MIN_ZOOM, MAX_ZOOM) } : null,
  };
}

function loadBoard(board, handle, name) {
  commitEditSilently();
  doc.title = board.title;
  doc.items = board.items;
  doc.order = [...board.items.keys()];
  doc.assets = board.assets;
  imageCache.clear();
  sel.clear();
  find.matches = [];
  clip = null;
  file.handle = handle;
  file.name = name;
  file.dirty = false;
  file.failed = false;
  clearTimeout(file.timer);
  resetHistory();
  $('#title').value = doc.title;
  syncStatus();
  syncEmptyState();
  refreshFramesPanel();
  selectionChanged();
  if (board.view) Object.assign(view, board.view);
  else if (doc.items.size) Object.assign(view, viewFor(unionBounds(doc.items.values()), 90));
  else Object.assign(view, { x: -stage.clientWidth / 2, y: -stage.clientHeight / 2, z: 1 });
  invalidate();
}

function commitEditSilently() {
  if (editing) cancelEdit();
}

// ---- Save -----------------------------------------------------------------

function markDirty() {
  file.dirty = true;
  file.generation += 1;
  syncStatus();
  if (file.handle && !file.failed) {
    clearTimeout(file.timer);
    file.timer = setTimeout(writeToHandle, AUTOSAVE_DELAY);
  }
}

function markClean() {
  file.dirty = false;
  file.failed = false;
  syncStatus();
}

async function writeToHandle() {
  if (!file.handle) return false;
  if (file.saving) return false;
  file.saving = true;
  clearTimeout(file.timer);
  syncStatus();
  const generation = file.generation;
  let ok = true;
  try {
    const stream = await file.handle.createWritable();
    await stream.write(serialize());
    await stream.close();
    file.failed = false;
  } catch (err) {
    ok = false;
    file.failed = true;
    toast(`Could not save to ${file.name}: ${err.message}. Use Save As to choose another location.`, true);
  }
  file.saving = false;
  if (ok && generation === file.generation) markClean();
  else if (ok) file.timer = setTimeout(writeToHandle, AUTOSAVE_DELAY);
  syncStatus();
  return ok;
}

const fileName = () => `${doc.title.replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'board'}${FILE_EXT}`;
const BOARD_TYPES = [{ description: 'MirCore board', accept: { 'application/json': [FILE_EXT] } }];

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function saveFile() {
  commitEdit();
  if (file.handle) return writeToHandle();
  return saveFileAs();
}

async function saveFileAs() {
  commitEdit();
  const picked = await pick(window.showSaveFilePicker, { suggestedName: fileName(), types: BOARD_TYPES });
  if (picked.cancelled) return false;
  if (picked.result) {
    file.handle = picked.result;
    file.name = file.handle.name;
    file.failed = false;
    return writeToHandle();
  }
  // No direct file access here: a normal download, which also means no autosave.
  toast('Saved through the browser’s downloads. Autosave is off, so press Ctrl+S to save again.');
  file.handle = null;
  file.name = fileName();
  downloadBlob(new Blob([serialize()], { type: 'application/json' }), file.name);
  markClean();
  return true;
}

// ---- Open -----------------------------------------------------------------

async function confirmDiscard() {
  if (!file.dirty) return true;
  const choice = await ask('Save changes first?', `"${doc.title}" has changes that are not saved to a file.`, [
    { label: 'Cancel', value: 'cancel', kind: 'secondary' },
    { label: 'Discard', value: 'discard', kind: 'destructive' },
    { label: 'Save', value: 'save', kind: 'primary' },
  ]);
  if (choice === 'save') return saveFile();
  return choice === 'discard';
}

function loadText(text, handle, name) {
  try {
    loadBoard(parseBoard(text), handle, name);
    toast(`Opened ${name}`);
  } catch (err) {
    toast(err instanceof SyntaxError ? `${name} is not a valid board file` : err.message, true);
  }
}

async function openFile() {
  if (!await confirmDiscard()) return;
  const picked = await pick(window.showOpenFilePicker, { types: BOARD_TYPES });
  if (picked.cancelled) return;
  if (picked.blocked) { $('#fileInput').click(); return; }
  const [handle] = picked.result;
  const chosen = await handle.getFile();
  loadText(await chosen.text(), handle, chosen.name);
}

async function openDroppedFile(dropped) {
  if (!await confirmDiscard()) return;
  loadText(await dropped.text(), null, dropped.name);
}

async function newBoard() {
  if (!await confirmDiscard()) return;
  loadBoard({ title: 'Untitled board', items: new Map(), assets: new Map(), view: null }, null, null);
}

// ---- Export ---------------------------------------------------------------

async function decodeImages(items) {
  await Promise.all(items.filter(i => i.type === 'image').map(i => imageFor(i.asset)?.decode().catch(() => {})));
}

function renderRegion(box, scale, items) {
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(box.w * scale));
  out.height = Math.max(1, Math.round(box.h * scale));
  const c = out.getContext('2d');
  c.fillStyle = '#ffffff';
  c.fillRect(0, 0, out.width, out.height);
  c.setTransform(scale, 0, 0, scale, -box.x * scale, -box.y * scale);
  const opts = { zoom: scale, shadows: true, background: '#ffffff', hideFrameTitles: false, skipTextOf: null };
  for (const item of items) drawItem(c, item, opts);
  return out;
}

const exportScale = box => Math.min(2, 8000 / Math.max(box.w, box.h, 1));
const toPngBlob = region => new Promise(resolve => region.toBlob(resolve, 'image/png'));

async function exportPng() {
  commitEdit();
  const chosen = selectedItems();
  const source = chosen.length ? chosen : paintOrder();
  if (!source.length) { toast('The board is empty'); return; }
  const box = padRect(unionBounds(source), 40);
  const all = paintOrder();
  await decodeImages(all);
  const blob = await toPngBlob(renderRegion(box, exportScale(box), all));
  const name = fileName().replace(FILE_EXT, '.png');
  const picked = await pick(window.showSaveFilePicker, { suggestedName: name, types: [{ description: 'PNG image', accept: { 'image/png': ['.png'] } }] });
  if (picked.cancelled) return;
  if (picked.blocked) { downloadBlob(blob, name); return; }
  try {
    const stream = await picked.result.createWritable();
    await stream.write(blob);
    await stream.close();
    toast(`Exported ${picked.result.name}`);
  } catch (err) {
    toast(`Could not export: ${err.message}`, true);
  }
}

// Uses the browser's own print dialog, whose "Save as PDF" stays on this machine.
async function printBoard() {
  commitEdit();
  const all = paintOrder();
  if (!all.length) { toast('The board is empty'); return; }
  await decodeImages(all);
  const frames = framesInOrder();
  const regions = frames.length ? frames : [padRect(unionBounds(all), 40)];
  const holder = $('#print');
  const urls = [];
  for (const region of regions) {
    const box = { x: region.x, y: region.y, w: region.w, h: region.h };
    const url = URL.createObjectURL(await toPngBlob(renderRegion(box, Math.min(2, 3000 / Math.max(box.w, box.h)), all)));
    urls.push(url);
    const img = h('img', { src: url, alt: region.title || 'Board' });
    holder.append(img);
    await img.decode();
  }
  window.addEventListener('afterprint', () => {
    holder.replaceChildren();
    urls.forEach(u => URL.revokeObjectURL(u));
  }, { once: true });
  window.print();
}

function bindFiles() {
  $('#fileInput').addEventListener('change', async e => {
    const picked = e.target.files[0];
    e.target.value = '';
    if (picked) loadText(await picked.text(), null, picked.name);
  });
  $('#imageInput').addEventListener('change', e => {
    addImageFiles([...e.target.files], toWorld(stageCenter()));
    e.target.value = '';
  });
  window.addEventListener('beforeunload', e => {
    if (file.dirty) e.preventDefault();
  });
}

const TOOLS = [
  ['select', 'select', 'Select', 'V'], ['hand', 'hand', 'Pan', 'H'], ['sticky', 'sticky', 'Sticky note', 'N'],
  ['text', 'text', 'Text', 'T'], ['shape', 'shape', 'Shapes', 'S'], ['line', 'line', 'Connector', 'L'],

function buildToolbar() {
  const list = $('#toolList');
  for (const [id, icon, label, key] of TOOLS) {
    const b = iconButton(icon, `${label} (${key})`, () => setTool(id));
    b.dataset.tool = id;
    b.append(h('span', { className: 'key' }, key));
    list.append(b);
  }
  list.append(iconButton('image', 'Add image from file (I)', () => $('#imageInput').click()));
}

function syncToolbar() {
  for (const b of document.querySelectorAll('#toolList [data-tool]')) b.setAttribute('aria-pressed', String(b.dataset.tool === tool));
  const fly = $('#flyout');
  fly.replaceChildren();
  fly.hidden = !['sticky', 'shape', 'pen'].includes(tool);
  if (fly.hidden) return;
  if (tool === 'sticky') {
    fly.append(h('div', { className: 'title' }, 'Sticky colour'), swatchGrid(STICKY_COLORS, memory.stickyColor, c => { memory.stickyColor = c; syncToolbar(); }));
  } else if (tool === 'shape') {
    const grid = h('div', { className: 'grid4' });
    for (const name of SHAPE_NAMES) {
      grid.append(iconButton(null, name, () => { memory.shape = name; syncToolbar(); }, { raw: SHAPE_ICONS[name], pressed: memory.shape === name }));
    }
    fly.append(h('div', { className: 'title' }, 'Drag on the board'), grid);
  } else {
    const marker = memory.penAlpha < 1;
    const kinds = h('div', { className: 'row' },
      textButton('Pen', !marker, () => { Object.assign(memory, { penAlpha: 1, penWidth: 3 }); syncToolbar(); }),
      textButton('Marker', marker, () => { Object.assign(memory, { penAlpha: 0.35, penWidth: 20 }); syncToolbar(); }));
    fly.append(kinds, swatchGrid(INK_COLORS, memory.penColor, c => { memory.penColor = c; syncToolbar(); }, true));
  }
  const anchor = document.querySelector(`#toolList [data-tool="${tool}"]`).getBoundingClientRect();
  fly.style.top = `${anchor.top - 6}px`;
}

function textButton(label, pressed, onClick, title = label) {
  const b = h('button', { className: 'btn txt', type: 'button', title, 'aria-label': title, on: { click: onClick } }, label);
  if (pressed !== undefined) b.setAttribute('aria-pressed', String(!!pressed));
  return b;
}

function swatchGrid(colors, current, pick, round = false) {
  const grid = h('div', { className: 'grid6' });
  for (const color of colors) {
    const b = h('button', {
      type: 'button', className: `swatch${round ? ' round' : ''}${color === 'transparent' ? ' none' : ''}`,
      title: color === 'transparent' ? 'No fill' : color, 'aria-label': color === 'transparent' ? 'No fill' : `Colour ${color}`,
      'aria-pressed': String(color === current), on: { click: () => pick(color) },
    });
    b.style.background = color;
    grid.append(b);
  }
  return grid;
}

function syncHistoryButtons() {
  $('#undoBtn').disabled = !history.past.length;
  $('#redoBtn').disabled = !history.future.length;
}

function syncEmptyState() {
  $('#empty').hidden = doc.items.size > 0;
}

function syncZoomLabel() {
  const label = `${Math.round(view.z * 100)}%`;
  const node = $('#zoomLabel');
  if (node.textContent !== label) node.textContent = label;
}

function syncStatus() {
  const node = $('#status');
  node.className = 'status';
  let text;
  if (file.failed) { text = 'Save failed'; node.classList.add('err'); }
  else if (file.saving) text = 'Saving…';
  else if (!file.name) {
    text = doc.items.size ? 'Not saved yet' : 'New board';
    if (doc.items.size) node.classList.add('warn');
  } else if (file.dirty) {
    text = file.handle ? 'Saving soon…' : `${file.name}: unsaved changes`;
    if (!file.handle) node.classList.add('warn');
  } else text = `Saved to ${file.name}`;
  node.textContent = text;
}

// ---- Popovers and menus ---------------------------------------------------

const pop = $('#pop');

function closePopover() {
  pop.hidden = true;
  pop.replaceChildren();
}

function openPopover(content, x, y) {
  pop.replaceChildren(content);
  pop.hidden = false;
  const r = pop.getBoundingClientRect();
  pop.style.left = `${clamp(x, 8, window.innerWidth - r.width - 8)}px`;
  pop.style.top = `${clamp(y, 8, window.innerHeight - r.height - 8)}px`;
}

function popoverBelow(anchor, content) {
  const r = anchor.getBoundingClientRect();
  openPopover(content, r.left, r.bottom + 8);
}

function menu(entries) {
  const root = h('div', { className: 'menu', role: 'menu' });
  for (const entry of entries) {
    if (!entry) { root.append(h('hr')); continue; }
    const b = h('button', {
      type: 'button', role: 'menuitem', disabled: !!entry.disabled, className: entry.danger ? 'danger' : '',
      on: { click: () => { closePopover(); entry.run(); } },
    }, h('span', {}, entry.label), entry.key ? h('kbd', {}, entry.key) : null);
    root.append(b);
  }
  return root;
}

function fileMenuEntries() {
  return [
    { label: 'New board', run: newBoard },
    { label: 'Open…', key: 'Ctrl+O', run: openFile },
    null,
    { label: 'Save', key: 'Ctrl+S', run: saveFile },
    { label: 'Save as…', key: 'Ctrl+Shift+S', run: saveFileAs },
    null,
    { label: sel.size ? 'Export selection as PNG…' : 'Export board as PNG…', run: exportPng },
    { label: 'Print or save as PDF…', run: printBoard },
  ];
}

function arrangeEntries() {
  const items = selectedItems();
  const grouped = items.some(i => i.group);
  const locked = items.length && items.every(i => i.locked);
  return [
    { label: 'Duplicate', key: 'Ctrl+D', run: duplicateSelection, disabled: !items.length },
    { label: 'Bring to front', key: 'Ctrl+]', run: () => reorder(true), disabled: !items.length },
    { label: 'Send to back', key: 'Ctrl+[', run: () => reorder(false), disabled: !items.length },
    null,
    { label: grouped ? 'Ungroup' : 'Group', key: grouped ? 'Ctrl+Shift+G' : 'Ctrl+G', run: grouped ? ungroupSelection : groupSelection, disabled: items.length < 2 && !grouped },
    { label: locked ? 'Unlock' : 'Lock', key: 'Ctrl+L', run: toggleLock, disabled: !items.length },
    null,
    { label: 'Delete', key: 'Del', run: deleteSelection, disabled: !items.length, danger: true },
  ];
}

function showContextMenu(x, y) {
  if (present.on) return;
  const item = hitTest(pointer.world);
  if (item && !sel.has(item.id)) setSelection(withGroup(item));
  const entries = sel.size ? arrangeEntries() : [
    { label: 'Add sticky here', run: () => createStickyAt(pointer.world) },
    { label: 'Select all', key: 'Ctrl+A', run: () => setSelection(doc.order.filter(id => !doc.items.get(id).locked)), disabled: !doc.order.length },
    { label: 'Fit board to screen', key: 'Ctrl+1', run: fitBoard },
  ];
  openPopover(menu(entries), x, y);
}

    on: { click: () => popoverBelow(b, swatchGrid(palette, current, c => { closePopover(); apply(c); }, round)) },

function refreshContextBar() {
  const bar = $('#ctx');
  bar.replaceChildren();
  const items = selectedItems();
  if (!items.length || editing || present.on || (mode && mode.type !== 'marquee')) { bar.hidden = true; return; }
  if (mode?.type === 'marquee') { bar.hidden = true; return; }
  const types = new Set(items.map(i => i.type));
  const first = items[0];
  const sep = () => h('span', { className: 'sep' });
  const has = (...t) => t.some(x => types.has(x));
  const allLocked = items.every(i => i.locked);

  if (allLocked) {
    bar.append(iconButton('unlock', 'Unlock (Ctrl+L)', toggleLock));
    bar.hidden = false;
    return;
  }

  if (has('sticky')) {
    const s = items.find(i => i.type === 'sticky');
    bar.append(colorControl('Sticky colour', s.color, STICKY_COLORS, c => {
      memory.stickyColor = c;
      changeSelection(i => (i.type === 'sticky' ? { color: c } : null));
    }));
  }
  if (has('shape')) {
    const s = items.find(i => i.type === 'shape');
    bar.append(
      colorControl('Fill', s.fill, FILL_COLORS, c => changeSelection(i => (i.type === 'shape' ? { fill: c } : null))),
      colorControl('Border', s.stroke, INK_COLORS, c => changeSelection(i => (i.type === 'shape' ? { stroke: c } : null)), true));
    if (items.length === 1) {
      const shapeBtn = iconButton(null, 'Change shape', () => {
        const grid = h('div', { className: 'grid4' });
        for (const name of SHAPE_NAMES) {
          grid.append(iconButton(null, name, () => { closePopover(); memory.shape = name; changeSelection(() => ({ shape: name })); }, { raw: SHAPE_ICONS[name], pressed: s.shape === name }));
        }
        popoverBelow(shapeBtn, grid);
      }, { raw: SHAPE_ICONS[s.shape] });
      bar.append(shapeBtn);
    }
  }
  if (has('frame')) {
    const f = items.find(i => i.type === 'frame');
    bar.append(colorControl('Background', f.fill, FILL_COLORS, c => changeSelection(i => (i.type === 'frame' ? { fill: c } : null))));
  }
  if (has('text')) {
    const t = items.find(i => i.type === 'text');
    bar.append(colorControl('Text colour', t.color, INK_COLORS, c => changeSelection(i => (i.type === 'text' ? { color: c } : null)), true));
  }
  if (has('line', 'pen')) {
    const l = items.find(i => i.type === 'line' || i.type === 'pen');
    bar.append(colorControl('Colour', l.color, INK_COLORS, c => changeSelection(i => (i.type === 'line' || i.type === 'pen' ? { color: c } : null)), true));

  if (has('line')) {
    const l = items.find(i => i.type === 'line');

    for (const kind of ['curve', 'elbow', 'straight']) {
      bar.append(iconButton(kind, `${kind[0].toUpperCase()}${kind.slice(1)} line`, () => {
        memory.lineKind = kind;
        changeSelection(i => (i.type === 'line' ? { kind } : null));

      ]));
    });
    bar.append(alignBtn, iconButton('grid', 'Tidy into a grid', tidySelection));
  }

  bar.append(sep());
  const moreBtn = iconButton('more', 'More', () => popoverBelow(moreBtn, menu(arrangeEntries())));
  bar.append(moreBtn);
  if (first) bar.hidden = false;
}

function positionContextBar() {
  const bar = $('#ctx');
  if (bar.hidden) return;
  const items = selectedItems();
  if (!items.length) return;
  const r = screenRect(unionBounds(items));
  const w = bar.offsetWidth, hh = bar.offsetHeight;
  const dots = quickDots().length ? 36 : 14;
  let y = r.y - hh - dots;
  if (y < 62) y = Math.min(r.y + r.h + dots, stage.clientHeight - hh - 62);
  const x = clamp(r.x + r.w / 2 - w / 2, 72, Math.max(72, stage.clientWidth - w - 12));
  bar.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
}

// ---- Frames panel ---------------------------------------------------------

function refreshFramesPanel() {
  const panel = $('#framesPanel');
  if (panel.hidden) return;
  const frames = framesInOrder();
  panel.replaceChildren(h('h2', {}, 'Frames'));
  if (!frames.length) {
    panel.append(h('p', { className: 'none' }, 'Press F and click the board. Frames become slides when you present.'));
    return;
  }
  frames.forEach((frame, i) => {
    const swap = other => {
      patch(frame.id, { seq: other.seq });
      patch(other.id, { seq: frame.seq });
      commit();
    };
    panel.append(h('div', { className: 'frameRow' },
      h('button', {
        className: 'name', type: 'button', title: frame.title,
        on: { click: () => { setSelection([frame.id]); animateView(viewFor(frame, 110)); } },
      }, `${i + 1}. ${frame.title || 'Frame'}`),
      iconButton('up', 'Move earlier', () => frames[i - 1] && swap(frames[i - 1])),
      iconButton('down', 'Move later', () => frames[i + 1] && swap(frames[i + 1]))));
  });
}

function toggleFramesPanel() {
  const panel = $('#framesPanel');
  panel.hidden = !panel.hidden;
  $('#framesBtn').setAttribute('aria-pressed', String(!panel.hidden));
  refreshFramesPanel();
}

function toggleMinimap() {
  const map = $('#minimap');
  map.hidden = !map.hidden;
  $('#mapBtn').setAttribute('aria-pressed', String(!map.hidden));
  invalidate();
}

function bindMinimap() {
  const jump = e => {
    const { scale, ox, oy, vp } = minimapFrame();
    const r = minimap.getBoundingClientRect();
    const wx = ((e.clientX - r.left) * (minimap.width / r.width) - ox) / scale;
    const wy = ((e.clientY - r.top) * (minimap.height / r.height) - oy) / scale;
    view.x = wx - vp.w / 2;
    view.y = wy - vp.h / 2;
    invalidate();
  };
  minimap.addEventListener('pointerdown', e => { minimap.setPointerCapture(e.pointerId); jump(e); });
  minimap.addEventListener('pointermove', e => { if (e.buttons) jump(e); });
}

// ---- Find -----------------------------------------------------------------

function openFind() {
  $('#findBox').hidden = false;
  $('#findInput').focus();
  $('#findInput').select();
}

function closeFind() {
  $('#findBox').hidden = true;
  $('#findInput').value = '';
  find.matches = [];
  invalidate();
}

function syncFindCount() {
  const input = $('#findInput').value;
  $('#findCount').textContent = !input ? '' : find.matches.length ? `${find.index + 1} / ${find.matches.length}` : 'None';
}

// ---- Dialogs and toasts ---------------------------------------------------

function toast(message, isError = false) {
  const node = h('div', { className: `toast${isError ? ' err' : ''}` }, message);
  $('#toasts').append(node);
  setTimeout(() => node.remove(), isError ? 7000 : 2600);
}

function ask(title, message, buttons) {
  const dialog = $('#dialog');
  return new Promise(resolve => {
    const actions = h('div', { className: 'actions' });
    for (const b of buttons) {
      actions.append(h('button', { type: 'button', className: b.kind, on: { click: () => { dialog.close(); resolve(b.value); } } }, b.label));
    }
    dialog.replaceChildren(h('h2', {}, title), h('p', {}, message), actions);
    dialog.oncancel = () => resolve('cancel');
    dialog.showModal();
  });
}

function showDialog(...content) {
  const dialog = $('#dialog');
  const done = h('button', { type: 'button', className: 'primary', on: { click: () => dialog.close() } }, 'Close');
  dialog.oncancel = null;
  dialog.replaceChildren(...content, h('div', { className: 'actions' }, done));
  dialog.showModal();
}

function showLocalInfo() {
  const policy = $('meta[http-equiv="Content-Security-Policy"]').content;
  const code = text => h('code', {}, text);
  showDialog(
    h('h2', {}, 'This board stays on your machine'),
    h('ul', {},
      h('li', {}, 'MirCore is one HTML file with no server, no account, no analytics and no external resources.'),
      h('li', {}, 'The browser enforces this: the page’s Content Security Policy blocks every network connection, and the script is pinned by hash.'),
      h('li', {}, 'Boards are written only to files you pick. Board content is not kept in browser storage, and the board name is left out of the tab title so it stays out of browser history.'),
      h('li', {}, 'Browser spellcheck is switched off while you type, because enhanced spellcheck services can send text to the cloud.'),
      h('li', {}, 'Links are not clickable and images are stored inside the board file, so opening a board cannot reach out.')),
    h('p', {}, 'Not covered: browser extensions can read any page, so use a browser profile without extensions for sensitive boards. The operating system still controls the saved files, the clipboard and the printer you choose.'),
    h('p', {}, 'Active policy: ', code(policy)));
}

function showHelp() {
  const section = (title, rows) => [h('h3', {}, title), ...rows.map(([label, key]) => h('div', {}, h('span', {}, label), h('kbd', {}, key)))];
  showDialog(
    h('h2', {}, 'Keyboard shortcuts'),
    h('div', { className: 'keys' },
      ...section('Brainstorm', [
        ['New sticky', 'Double-click or N'], ['Next sticky to the right', 'Tab'], ['Next sticky below', 'Ctrl+Enter'], ['Finish typing', 'Esc'],
        ['Edit selected', 'Enter'], ['Connected idea', 'Drag a + dot'], ['Sticky per line', 'Paste a list'], ['Copy while dragging', 'Alt+drag'],
      ]),
      ...section('Tools', [
        ['Select', 'V'], ['Pan', 'H or Space+drag'], ['Text', 'T'], ['Shape', 'S'], ['Connector', 'L'], ['Pen', 'P'], ['Eraser', 'E'], ['Frame', 'F'], ['Image', 'I'], ['Minimap', 'M'],
      ]),
      ...section('Edit', [
        ['Undo', 'Ctrl+Z'], ['Redo', 'Ctrl+Y'], ['Duplicate', 'Ctrl+D'], ['Select all', 'Ctrl+A'], ['Group', 'Ctrl+G'], ['Ungroup', 'Ctrl+Shift+G'], ['Lock', 'Ctrl+L'],
        ['Front / back', 'Ctrl+] / Ctrl+['], ['Nudge', 'Arrows'], ['Skip snapping', 'Hold Ctrl'],
      ]),
      ...section('View and file', [
        ['Zoom', 'Ctrl+wheel'], ['Pan', 'Right-drag'], ['100%', 'Ctrl+0'], ['Fit board', 'Ctrl+1'], ['Zoom to selection', 'Ctrl+2'], ['Find', 'Ctrl+F'], ['Save', 'Ctrl+S'], ['Open', 'Ctrl+O'],
      ])));
}

// ---- Wiring ---------------------------------------------------------------

function bindUI() {
  setIcon($('#menuBtn'), 'menu');
  setIcon($('#findBtn'), 'search');
  setIcon($('#framesBtn'), 'frames');
  setIcon($('#helpBtn'), 'help');
  setIcon($('#undoBtn'), 'undo');
  setIcon($('#redoBtn'), 'redo');
  setIcon($('#zoomIn'), 'plus');
  setIcon($('#zoomOut'), 'minus');
  setIcon($('#mapBtn'), 'map');
  setIcon($('#findClose'), 'close');
  setIcon($('#prevFrame'), 'left');
  setIcon($('#nextFrame'), 'right');
  $('#localBtn').innerHTML = `${svg(ICONS.shield)}<span>Local only</span>`;

  $('#menuBtn').addEventListener('click', e => { e.stopPropagation(); popoverBelow($('#menuBtn'), menu(fileMenuEntries())); });
  $('#status').addEventListener('click', saveFile);
  $('#localBtn').addEventListener('click', showLocalInfo);
  $('#findBtn').addEventListener('click', openFind);
  $('#framesBtn').addEventListener('click', toggleFramesPanel);
  $('#helpBtn').addEventListener('click', showHelp);
  $('#presentBtn').addEventListener('click', startPresenting);
  $('#undoBtn').addEventListener('click', undo);
  $('#redoBtn').addEventListener('click', redo);
  $('#zoomIn').addEventListener('click', () => zoomAt(stageCenter(), view.z * 1.25));
  $('#zoomOut').addEventListener('click', () => zoomAt(stageCenter(), view.z / 1.25));
  $('#zoomLabel').addEventListener('click', fitBoard);
  $('#mapBtn').addEventListener('click', toggleMinimap);
  $('#prevFrame').addEventListener('click', () => showFrame(present.index - 1));
  $('#nextFrame').addEventListener('click', () => showFrame(present.index + 1));
  $('#endPresent').addEventListener('click', endPresenting);
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) endPresenting(); });

  $('#title').addEventListener('input', e => { doc.title = e.target.value || 'Untitled board'; markDirty(); });
  $('#title').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') e.target.blur(); });

  $('#findInput').addEventListener('input', e => runFind(e.target.value));
  $('#findInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
    if (e.key === 'Escape') closeFind();
  });
  $('#findClose').addEventListener('click', closeFind);

  document.addEventListener('click', e => {
    if (e.detail > 0 && e.target.closest?.('button')) document.activeElement?.blur?.();
  });
  document.addEventListener('pointerdown', e => {
    if (!pop.hidden && !pop.contains(e.target) && e.target !== canvas) closePopover();
  });
}

// Startup.

function init() {
  buildToolbar();
  bindUI();
  bindInput();
  bindMinimap();
  bindFiles();
  resizeCanvas();
  view.x = -stage.clientWidth / 2;
  view.y = -stage.clientHeight / 2;
  $('#title').value = doc.title;
  resetHistory();
  syncToolbar();
  syncStatus();
  syncEmptyState();
  syncCursor();
  // Read-only view of the board for the end-to-end tests in test/e2e.mjs.
  window.mircore = Object.freeze({ snapshot: () => JSON.parse(serialize()), selection: () => [...sel], status: () => ({ ...file, handle: !!file.handle }) });
  invalidate();
}

init();

})();
</script>
